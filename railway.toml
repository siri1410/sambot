# Railway configuration
# See: https://docs.railway.app/reference/config-as-code

[build]
# Use Dockerfile for building
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Start command (overrides Dockerfile CMD if needed)
startCommand = "node dist/index.js gateway run --port $PORT --bind lan --allow-unconfigured"

# Health check configuration
healthcheckPath = "/health"
healthcheckTimeout = 300

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Resource limits (adjust based on your plan)
# numReplicas = 1

[deploy.healthcheck]
# Railway health check settings
path = "/health"
timeout = 300
interval = 30
